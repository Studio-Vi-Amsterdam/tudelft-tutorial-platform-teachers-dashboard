<VirtualHost *:80>
        ServerName SERVER_NAME
        ServerAlias SERVER_NAME

        RewriteEngine On
        RewriteCond %{HTTPS} off
        RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

<VirtualHost *:443>
        ServerName SERVER_NAME
        ServerAlias SERVER_NAME

        SSLEngine on
        SSLCertificateFile <ABSOLUTE PATH TO CERTIFICATE FILE>/SERVER_NAME.crt
        SSLCertificateKeyFile <ABSOLUTE PATH TO CERTIFICATE KEY FILE>/SERVER_NAME.key
        SSLProtocol -all +TLSv1.2 +TLSv1.3
        SSLHonorCipherOrder off

        # Also set in the global Apache config (not allowed inside a VirtualHost):
        #   ServerTokens Prod
        #   ServerSignature Off
        #   TraceEnable Off

        Protocols h2 http/1.1

        # Static single-page app: no CORS, so refuse OPTIONS entirely
        # (Rapid7 finding http-options-method-enabled)
        RewriteEngine On
        RewriteCond %{REQUEST_METHOD} =OPTIONS
        RewriteRule ^ - [F]

        ProxyPreserveHost On
        ProxyPass / http://localhost:8080/
        ProxyPassReverse / http://localhost:8080/

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
